name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs `npm ci` over the whole dependency tree, so it gets read
# only. Deploy-scoped tokens are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild copies the CSVs, the DuckDB-WASM bundle and Pyodide into
      # site/public, so the deployed site serves both runtimes from its own
      # origin.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
